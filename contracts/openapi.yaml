openapi: 3.1.0
info:
  title: VR-GeoNusa API
  version: 0.9.0
paths:
  /api/v1/health:
    get:
      operationId: getHealth
      summary: Check API health
      responses:
        "200":
          description: API is healthy
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [status]
                    properties:
                      status:
                        type: string
                        const: ok
        default:
          description: API error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/auth/login:
    post:
      operationId: loginStudent
      summary: Authenticate a student
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Student authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "422":
          description: Invalid input or credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/auth/logout:
    post:
      operationId: logoutStudent
      summary: Revoke the current access token
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Student logged out
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/me:
    get:
      operationId: getCurrentStudent
      summary: Get the authenticated student
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Authenticated student
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthenticatedStudentResponse"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/me/learning-sessions/active:
    get:
      operationId: getActiveLearningSession
      summary: Get the authenticated student's active learning session
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Active learning session, or null when none exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActiveLearningSessionResponse"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/learning-sessions:
    post:
      operationId: createLearningSession
      summary: Create a learning session for the authenticated student
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateLearningSessionRequest"
      responses:
        "201":
          description: Learning session created; the write token is returned only once
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateLearningSessionResponse"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Respondent code does not belong to the authenticated student
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: The student already has an active learning session or the study has no published Learning Experience Revision
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Invalid input or client-supplied session state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/learning-sessions/{id}:
    get:
      operationId: getLearningSession
      summary: Get an owned learning session using its write token
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/LearningSessionId"
        - $ref: "#/components/parameters/SessionWriteToken"
      responses:
        "200":
          description: Learning session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LearningSessionResponse"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Invalid session write token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Learning session not found or not owned by the student
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/learning-sessions/{id}/progress:
    get:
      operationId: getExplorationProgress
      summary: Get server-calculated completion status for the owned session's required exploration activities
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/LearningSessionId"
      responses:
        "200":
          description: Required activity completion status without Micro Quiz answer or correctness data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExplorationProgressResponse"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Learning session not found or not owned by the student
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/learning-sessions/{id}/exploration/complete:
    post:
      operationId: completeExploration
      summary: Advance an owned exploration session to posttest after every required activity is complete
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/LearningSessionId"
        - $ref: "#/components/parameters/SessionWriteToken"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
      responses:
        "200":
          description: Exploration completed and the session advanced to posttest
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LearningSessionResponse"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Invalid session write token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Learning session not found or not owned by the student
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: A required activity is incomplete or the session is not in exploration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/learning-sessions/{id}/panorama-visits:
    post:
      operationId: recordPanoramaVisit
      summary: Record a panorama visit during exploration
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/LearningSessionId"
        - $ref: "#/components/parameters/SessionWriteToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecordPanoramaVisitRequest"
      responses:
        "201":
          description: Panorama visit recorded and current panorama updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActivityEventResponse"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Invalid session write token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Learning session not found or not owned by the student
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Learning session is not in the exploration phase
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Invalid panorama node or client-supplied visit state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/learning-sessions/{id}/materials/{objectId}/viewed:
    post:
      operationId: recordLearningMaterialView
      summary: Record a heritage-object learning material view during exploration
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/LearningSessionId"
        - $ref: "#/components/parameters/HeritageObjectPathId"
        - $ref: "#/components/parameters/SessionWriteToken"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecordMaterialViewRequest"
      responses:
        "201":
          description: Learning material view recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MaterialViewEventResponse"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Invalid session write token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Learning session is not owned or heritage object does not exist
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Learning session is not in the exploration phase
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Client supplied server-owned material-view state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/learning-sessions/{id}/quiz-attempts:
    post:
      operationId: startMicroQuizAttempt
      summary: Start a Micro Quiz attempt during exploration
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/LearningSessionId"
        - $ref: "#/components/parameters/SessionWriteToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartQuizAttemptRequest"
      responses:
        "201":
          description: Micro Quiz attempt created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuizAttemptResponse"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Invalid session write token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Learning session not found or not owned by the student
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Learning session is not in the exploration phase
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Invalid quiz or client-supplied scoring or feedback fields
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/quiz-attempts/{attemptId}/answers/{questionId}:
    put:
      operationId: answerMicroQuizQuestion
      summary: Immutably answer one Micro Quiz question with formative feedback
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/QuizAttemptPathId"
        - $ref: "#/components/parameters/QuizQuestionPathId"
        - $ref: "#/components/parameters/SessionWriteToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaveQuizAnswerRequest"
      responses:
        "200":
          description: Answer recorded with server-calculated correctness and formative feedback
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuizAnswerResponse"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Invalid session write token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Micro Quiz attempt not found or not owned by the student
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Question was already answered or session is not in exploration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Invalid question, selected option, or client-supplied scoring or feedback fields
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/quiz-attempts/{attemptId}/submit:
    post:
      operationId: submitMicroQuizAttempt
      summary: Score, complete, and lock a fully answered Micro Quiz attempt
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/QuizAttemptPathId"
        - $ref: "#/components/parameters/SessionWriteToken"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitQuizAttemptRequest"
      responses:
        "200":
          description: Micro Quiz attempt submitted with its formative score
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuizAttemptResponse"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Invalid session write token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Micro Quiz attempt not found or not owned by the student
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Attempt is incomplete, submitted, or outside the exploration phase
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Client supplied score or submission state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/learning-sessions/{id}/assessment-attempts:
    post:
      operationId: startAssessmentAttempt
      summary: Start the assessment matching the learning session's current phase
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/LearningSessionId"
        - $ref: "#/components/parameters/SessionWriteToken"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartAssessmentAttemptRequest"
      responses:
        "201":
          description: Assessment attempt created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssessmentAttemptResponse"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Invalid session write token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Learning session not found or not owned by the student
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Session phase is invalid, instrument is unavailable, or an attempt already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Client supplied server-owned assessment state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/assessment-attempts/{id}:
    get:
      operationId: getAssessmentAttempt
      summary: Get an assessment attempt owned by the authenticated student
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/AssessmentAttemptId"
      responses:
        "200":
          description: Assessment attempt without answer correctness or score
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssessmentAttemptResponse"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Assessment attempt not found or not owned by the student
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/assessment-attempts/{attemptId}/answers/{itemId}:
    put:
      operationId: saveAssessmentAnswer
      summary: Create or replace one answer on a draft assessment attempt
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/AssessmentAttemptPathId"
        - $ref: "#/components/parameters/AssessmentItemPathId"
        - $ref: "#/components/parameters/SessionWriteToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaveAssessmentAnswerRequest"
      responses:
        "200":
          description: Answer saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssessmentAttemptResponse"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Invalid session write token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Assessment attempt not found or not owned by the student
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Attempt is submitted or invalid for the current session phase
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Invalid item or selected option
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/assessment-attempts/{attemptId}/submit:
    post:
      operationId: submitAssessmentAttempt
      summary: Score and lock a complete assessment attempt
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/AssessmentAttemptPathId"
        - $ref: "#/components/parameters/SessionWriteToken"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitAssessmentAttemptRequest"
      responses:
        "200":
          description: Assessment submitted; a pretest submission advances the session to exploration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssessmentAttemptResponse"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Invalid session write token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Assessment attempt not found or not owned by the student
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Attempt is incomplete, submitted, or invalid for the current session phase
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Client supplied score, correctness, or submission state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/heritage-sites:
    get:
      operationId: listHeritageSites
      summary: List heritage sites
      responses:
        "200":
          description: Heritage sites
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HeritageSiteListResponse"
  /api/v1/heritage-sites/{slug}:
    get:
      operationId: getHeritageSite
      summary: Get a heritage site
      parameters:
        - $ref: "#/components/parameters/HeritageSiteSlug"
      responses:
        "200":
          description: Heritage site
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HeritageSiteResponse"
        "404":
          description: Heritage site not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/heritage-sites/{slug}/areas:
    get:
      operationId: listHeritageSiteAreas
      summary: List a heritage site's areas and panorama nodes
      parameters:
        - $ref: "#/components/parameters/HeritageSiteSlug"
      responses:
        "200":
          description: Heritage areas
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HeritageAreaListResponse"
        "404":
          description: Heritage site not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/panorama-nodes/{id}:
    get:
      operationId: getPanoramaNode
      summary: Get a panorama node and its outgoing navigation links
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Panorama node
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PanoramaNodeResponse"
        "404":
          description: Panorama node not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/heritage-objects/{id}/learning-material:
    get:
      operationId: getHeritageObjectLearningMaterial
      summary: Get geometry mappings and learning material for a heritage object
      parameters:
        - $ref: "#/components/parameters/HeritageObjectId"
      responses:
        "200":
          description: Heritage-object learning material
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LearningMaterialResponse"
        "404":
          description: Heritage object not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/quizzes/{id}:
    get:
      operationId: getMicroQuiz
      summary: Get a Micro Quiz and its ordered questions
      parameters:
        - $ref: "#/components/parameters/QuizId"
      responses:
        "200":
          description: Micro Quiz without answer keys or formative feedback
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MicroQuizResponse"
        "404":
          description: Micro Quiz not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  parameters:
    HeritageSiteSlug:
      name: slug
      in: path
      required: true
      schema:
        type: string
    LearningSessionId:
      name: id
      in: path
      required: true
      schema:
        type: integer
    HeritageObjectId:
      name: id
      in: path
      required: true
      schema:
        type: integer
    HeritageObjectPathId:
      name: objectId
      in: path
      required: true
      schema:
        type: integer
    QuizId:
      name: id
      in: path
      required: true
      schema:
        type: integer
    QuizAttemptPathId:
      name: attemptId
      in: path
      required: true
      schema:
        type: integer
    QuizQuestionPathId:
      name: questionId
      in: path
      required: true
      schema:
        type: integer
    AssessmentAttemptId:
      name: id
      in: path
      required: true
      schema:
        type: integer
    AssessmentAttemptPathId:
      name: attemptId
      in: path
      required: true
      schema:
        type: integer
    AssessmentItemPathId:
      name: itemId
      in: path
      required: true
      schema:
        type: integer
    SessionWriteToken:
      name: X-Session-Write-Token
      in: header
      required: true
      schema:
        type: string
        minLength: 64
        maxLength: 64
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Sanctum token
  schemas:
    RecordPanoramaVisitRequest:
      type: object
      additionalProperties: false
      required: [panorama_node_id]
      properties:
        panorama_node_id:
          type: integer
    RecordMaterialViewRequest:
      type: object
      additionalProperties: false
      properties: {}
    StartQuizAttemptRequest:
      type: object
      additionalProperties: false
      required: [quiz_id]
      properties:
        quiz_id:
          type: integer
    SaveQuizAnswerRequest:
      type: object
      additionalProperties: false
      required: [selected_option_id]
      properties:
        selected_option_id:
          type: integer
    SubmitQuizAttemptRequest:
      type: object
      additionalProperties: false
      properties: {}
    QuizAttemptResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/QuizAttempt"
    QuizAttempt:
      type: object
      additionalProperties: false
      required: [id, quiz_id, status, score, submitted_at, created_at]
      properties:
        id:
          type: integer
        quiz_id:
          type: integer
        status:
          type: string
          enum: [draft, submitted]
        score:
          type: [integer, "null"]
          minimum: 0
          maximum: 100
        submitted_at:
          type: [string, "null"]
          format: date-time
        created_at:
          type: string
          format: date-time
    QuizAnswerResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/QuizAnswer"
    QuizAnswer:
      type: object
      additionalProperties: false
      required: [id, question_id, selected_option_id, is_correct, feedback, answered_at]
      properties:
        id:
          type: integer
        question_id:
