openapi: 3.1.0
info:
  title: VR-GeoNusa API
  version: 0.1.0
paths:
  /api/v1/health:
    get:
      operationId: getHealth
      summary: Check API health
      responses:
        "200":
          description: API is healthy
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [status]
                    properties:
                      status:
                        type: string
                        const: ok
