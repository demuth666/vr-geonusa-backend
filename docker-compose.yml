services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7.4-alpine
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    # MinIO stopped publishing its official images to Docker Hub, so the community
    # builds that track upstream releases are pinned here instead.
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "127.0.0.1:${MINIO_API_HOST_PORT}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_HOST_PORT}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio-init:
    image: pgsty/mc:RELEASE.2026-10-25T00-00-00Z
    entrypoint:
      - /bin/sh
      - -c
      - |
        mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"
        mc mb --ignore-existing "local/$${MINIO_BUCKET}"
        mc anonymous set download "local/$${MINIO_BUCKET}"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET:-vr-geonusa-dev}
    depends_on:
      minio:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: infrastructure/docker/api.Dockerfile
    env_file:
      - apps/api/.env
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:${API_HOST_PORT}
      LOG_CHANNEL: stderr
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${POSTGRES_DB}
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_CLIENT: phpredis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CACHE_STORE: redis
      SESSION_DRIVER: redis
      QUEUE_CONNECTION: redis
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      AWS_DEFAULT_REGION: us-east-1
      AWS_BUCKET: ${MINIO_BUCKET:-vr-geonusa-dev}
      AWS_URL: http://127.0.0.1:${MINIO_API_HOST_PORT}/${MINIO_BUCKET:-vr-geonusa-dev}
      AWS_ENDPOINT: http://minio:9000
      AWS_USE_PATH_STYLE_ENDPOINT: "true"
      ML_SERVICE_URL: http://ml:8001
    ports:
      - "127.0.0.1:${API_HOST_PORT}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1:8000/api/v1/health') === false ? 1 : 0);"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  ml-artifacts:
    # Fetches the model artifact into ./artifacts, the directory the ml service mounts.
    # Pinned to a release asset and its checksum, so every clone fetches the same bytes.
    # It is behind a profile because the default dummy detector needs no artifact:
    # docker compose --profile artifacts run --rm ml-artifacts
    profiles: ["artifacts"]
    image: curlimages/curl:8.22.0
    # The artifact lands in the mounted directory, which on Linux hosts belongs to the
    # developer; the image's own unprivileged user cannot write there.
    user: "0:0"
    entrypoint: ["/bin/sh", "/fetch-model.sh"]
    volumes:
      - ./artifacts:/artifacts
      - ./infrastructure/scripts/fetch-model.sh:/fetch-model.sh:ro
    environment:
      MODEL_URL: ${ML_MODEL_URL:-https://github.com/ultralytics/assets/releases/download/v8.3.0/yolov8n.pt}
      MODEL_SHA256: ${ML_MODEL_SHA256:-f59b3d833e2ff32e194b5bb8e08d211dc7c5bdf144b90d2c8412c47ccfc83b36}

  ml:
    build:
      context: .
      dockerfile: infrastructure/docker/ml.Dockerfile
      args:
        INSTALL_YOLO: ${INSTALL_YOLO:-false}
    environment:
      ML_DETECTOR: ${ML_DETECTOR:-dummy}
      ML_MODEL_PATH: ${ML_MODEL_PATH:-/app/artifacts/yolov8n.pt}
      ML_MODEL_VERSION: ${ML_MODEL_VERSION:-}
      ML_IMAGE_SIZE: ${ML_IMAGE_SIZE:-}
      ML_CONFIDENCE_THRESHOLD: ${ML_CONFIDENCE_THRESHOLD:-}
    volumes:
      - ./artifacts:/app/artifacts:ro
    ports:
      - "127.0.0.1:${ML_HOST_PORT}:8001"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 10
      # Loading the model artifact before the service serves is part of startup, so the
      # first checks are allowed to fail while the inference runtime initialises.
      start_period: 30s

volumes:
  postgres_data:
  minio_data:
